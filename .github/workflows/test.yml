name: Downloader regression and container integration

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: downloader-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-container-smoke:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v4
      - name: Build standalone image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: download-transformers-pretrained:ci
          cache-from: type=gha,scope=standalone-downloader
          cache-to: type=gha,scope=standalone-downloader,mode=max
      - name: Check image user and run mounted-list download
        shell: bash
        run: |
          image=download-transformers-pretrained:ci
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = '10001:10001'
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m "$image" --help
          expected_hfrs_license_sha256=8c6db340475136df3c1201d458fa5755698eace76e510471ecc9d857d6083dac
          actual_hfrs_license_sha256=$(sha256sum licenses/hf-hub-LICENSE | cut -d ' ' -f 1)
          test "$actual_hfrs_license_sha256" = "$expected_hfrs_license_sha256"
          docker run --rm --read-only \
            -v "$PWD/LICENSE:/tmp/project-LICENSE:ro" \
            -v "$PWD/licenses/hf-hub-LICENSE:/tmp/hfrs-LICENSE:ro" \
            -v "$PWD/THIRD_PARTY_NOTICES.md:/tmp/THIRD_PARTY_NOTICES.md:ro" \
            --entrypoint python "$image" -B -c '
          from hashlib import sha256
          from pathlib import Path

          licenses = Path("/usr/share/licenses/download-transformers-pretrained")
          expected = {
              licenses / "LICENSE": Path("/tmp/project-LICENSE"),
              licenses / "hfrs/LICENSE": Path("/tmp/hfrs-LICENSE"),
              licenses / "THIRD_PARTY_NOTICES.md": Path("/tmp/THIRD_PARTY_NOTICES.md"),
          }
          assert licenses.stat().st_mode & 0o222 == 0
          for packaged, source in expected.items():
              assert packaged.read_bytes() == source.read_bytes()
              assert packaged.stat().st_mode & 0o222 == 0
          assert sha256((licenses / "hfrs/LICENSE").read_bytes()).hexdigest() == (
              "8c6db340475136df3c1201d458fa5755698eace76e510471ecc9d857d6083dac"
          )
          notices = (licenses / "THIRD_PARTY_NOTICES.md").read_text(encoding="utf-8")
          assert "473de9430b0fbc544fb1d91102180eb713f8dc87" in notices
          assert "not a complete, per-crate license inventory" in " ".join(notices.split())
          assert Path("/usr/local/lib/python3.12/LICENSE.txt").is_file()
          assert Path("/usr/share/doc/base-files/copyright").is_file()
          '
          smoke_dir="$RUNNER_TEMP/downloader-smoke"
          mkdir -p "$smoke_dir/models" "$smoke_dir/cache"
          chmod 755 "$smoke_dir" "$smoke_dir/models" "$smoke_dir/cache"
          printf 'gpt2\n' > "$smoke_dir/models.txt"
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --user "$(id -u):$(id -g)" \
            -v "$smoke_dir/models.txt:/config/models.txt:ro" \
            -v "$smoke_dir/models:/models" \
            -v "$smoke_dir/cache:/cache" \
            "$image" --requirement /config/models.txt \
            --include config.json --include config.json
          test -s "$smoke_dir/models/gpt2/config.json"
      - name: Check official hfrs cache path and download
        shell: bash
        run: |
          image=download-transformers-pretrained:ci
          cache_dir="$RUNNER_TEMP/downloader-smoke/cache"
          env_output=$(docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --user "$(id -u):$(id -g)" -v "$cache_dir:/cache" \
            --entrypoint hfrs "$image" env)
          grep -F 'HF_HUB_CACHE: /cache/huggingface/hub' <<< "$env_output"
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --user "$(id -u):$(id -g)" -v "$cache_dir:/cache" \
            --entrypoint hfrs "$image" download gpt2 config.json --quiet
          test -n "$(find "$cache_dir/huggingface/hub/models--gpt2" -type f -size +0c -print -quit)"
      - name: Export tested standalone image
        run: |
          docker tag download-transformers-pretrained:ci download-transformers-pretrained:standalone
          docker save download-transformers-pretrained:standalone -o "$RUNNER_TEMP/download-transformers-pretrained-linux-amd64.tar"
      - name: Upload tested standalone image
        uses: actions/upload-artifact@v7.0.2
        with:
          name: download-transformers-pretrained-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/download-transformers-pretrained-linux-amd64.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
