name: Downloader regression and hfrs integration

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: downloader-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-hfrs-smoke:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore pinned hfrs and Cargo cache
        id: hfrs-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry
            ${{ runner.temp }}/cargo-home/git
            ${{ runner.temp }}/hfrs/bin/hfrs
          key: hfrs-${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04-473de9430b0fbc544fb1d91102180eb713f8dc87
      - name: Install pinned official hfrs CLI
        if: steps.hfrs-cache.outputs.cache-hit != 'true'
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: |
          cargo install --locked \
            --root "$RUNNER_TEMP/hfrs" \
            --git https://github.com/huggingface/hf-hub.git \
            --rev 473de9430b0fbc544fb1d91102180eb713f8dc87 \
            hfrs
      - name: Add hfrs to PATH
        run: echo "$RUNNER_TEMP/hfrs/bin" >> "$GITHUB_PATH"
      - name: Check hfrs command and download a small public config
        run: |
          hfrs download --help
          python script/download.py \
            --model gpt2 \
            --include config.json \
            --output-dir "$RUNNER_TEMP/hf-models"
          test -f "$RUNNER_TEMP/hf-models/gpt2/config.json"
